<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5 d-flex flex-column align-items-center mb-4">
                <h3 class="mb-3 text-primary">Gato</h3>
                <button id="btn-gato" class="btn btn-primary mb-3 px-4 py-2">Ver otro gato</button>
                <div id="mensaje-cargando-gato" class="mb-2 text-info" style="display:none;">Cargando...</div>
                <div id="img-gato" class="mb-2"></div>
            </div>
            <div class="col-md-5 d-flex flex-column align-items-center mb-4">
                <h3 class="mb-3 text-success">Perro</h3>
                <button id="btn-perro" class="btn btn-success mb-3 px-4 py-2">Ver otro perro</button>
                <div id="mensaje-cargando-perro" class="mb-2 text-info" style="display:none;">Cargando...</div>
                <div id="img-perro" class="mb-2"></div>
            </div>
        </div>
    </div>
    
    <script src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
